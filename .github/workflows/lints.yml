name: Lints (deny)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until policy stabilises
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
