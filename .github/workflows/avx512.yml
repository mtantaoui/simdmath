name: AVX-512

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: RUSTFLAGS="-C target-feature=+avx512f,+avx512vl" cargo clippy --all-targets --target x86_64-unknown-linux-gnu -- -D warnings

  build:
    name: Build (no run — GitHub runners lack AVX-512)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # GitHub-hosted ubuntu-latest runners do not provide AVX-512 instructions,
      # so executing the test binary would SIGILL. We compile-only here; once a
      # self-hosted AVX-512 runner or Intel SDE integration is available, switch
      # to a real `cargo test` job.
      - run: RUSTFLAGS="-C target-feature=+avx512f,+avx512vl" cargo test --no-run --target x86_64-unknown-linux-gnu
