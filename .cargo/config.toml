[build]
# Inject KaTeX into rustdoc so $..$ and $$..$$ math renders.
# Mirror this in Cargo.toml under [package.metadata.docs.rs] so docs.rs renders
# identically.
rustdocflags = ["--html-in-header", "./docs/docs-header.html"]

# Note: do NOT set `target-cpu=native` here. That config is checked into the
# repository and would silently apply to anyone who builds simdmath as a path
# or git dependency. Developers wanting native-CPU builds should set RUSTFLAGS
# in their own environment.
